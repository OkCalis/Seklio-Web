name: Deploy to GitHub Pages

on:
  # Publishing is tag-driven: pushing ANY tag (or publishing a release, which
  # creates one) deploys that tag's commit. Name doesn't matter — the most
  # recently pushed tag is what goes live. Merging to main no longer deploys.
  push:
    tags: ['**']
  # Manual re-deploy / rollback: Actions -> Run workflow -> pick any tag.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
